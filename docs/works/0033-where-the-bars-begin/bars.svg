  <text x="325.0" y="292" text-anchor="middle" font-size="10" fill="#333">Same eight values, both panels, top to bottom, left to right: 42 45 47 44 49 51 48 53.</text>
<text x="325.0" y="307" text-anchor="middle" font-size="10" fill="#333">Nothing in either bar is false. The only thing that moved is where the axis is allowed to start.</text>
<text x="325.0" y="322" text-anchor="middle" font-size="10" fill="#333">A truncated floor is not always a lie: sometimes the honest zero would hide a difference that actually matters.</text>
<text x="325.0" y="337" text-anchor="middle" font-size="10" fill="#333">This one has no printed verdict on which panel you should trust. That is the part left for you to decide.</text>
