<svg viewBox="0 0 830 624" xmlns="http://www.w3.org/2000/svg" font-family="monospace" font-size="22">
<title>The Shape a Throat Makes</title>
<rect x="0" y="0" width="830" height="624" fill="#f4f1ea"/>
<text x="415.0" y="62" text-anchor="middle" fill="#1c1a17">One</text>
<text x="415.0" y="96" text-anchor="middle" fill="#1c1a17">strike,</text>
<text x="415.0" y="130" text-anchor="middle" fill="#1c1a17">and already</text>
<text x="415.0" y="164" text-anchor="middle" fill="#1c1a17">I am leaving,</text>
<text x="415.0" y="198" text-anchor="middle" fill="#1c1a17">down through the bronze</text>
<text x="415.0" y="232" text-anchor="middle" fill="#1c1a17">faster than the hand that</text>
<text x="415.0" y="266" text-anchor="middle" fill="#1c1a17">swung it, faster than the ear</text>
<text x="415.0" y="300" text-anchor="middle" fill="#1c1a17">that flinched before it heard me,</text>
<text x="415.0" y="334" text-anchor="middle" fill="#1c1a17">narrowing where the metal</text>
<text x="415.0" y="368" text-anchor="middle" fill="#1c1a17">narrows, a held breath in</text>
<text x="415.0" y="402" text-anchor="middle" fill="#1c1a17">shaped like a throat,</text>
<text x="415.0" y="436" text-anchor="middle" fill="#1c1a17">just before it widens,</text>
<text x="415.0" y="470" text-anchor="middle" fill="#1c1a17">and I widen too, spilling</text>
<text x="415.0" y="504" text-anchor="middle" fill="#1c1a17">past the lip and out into a room</text>
<text x="415.0" y="538" text-anchor="middle" fill="#1c1a17">built with nothing in it shaped to stop me,</text>
<text x="415.0" y="572" text-anchor="middle" fill="#1c1a17">thinner now, thinner, gone, and still ringing somewhere</text>
</svg>
